[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "metacog-llm-compute"
version = "0.1.0"
description = "Metacognitive effort allocation in sequential LM agents"
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "pandas",
    "scipy",
    "pyyaml",
    "python-dotenv>=1.0.0",
    "matplotlib",
    "seaborn",
]
[project.optional-dependencies]
dev = [
    "pytest>=7",
    "pytest-cov>=4",
    "ruff>=0.6.0",
    "mypy>=1.11.0",
    "pre-commit>=4.0.0",
    "types-PyYAML>=6.0",
    "pandas-stubs>=2.0",
]
full = [
    "vllm==0.19.1",
    "transformers==4.56.2",
    "torch==2.4.0",
    "lmstudio>=1.5.0",
    "httpx>=0.27.0",
    "accelerate",
    "textworld",
]
tracing = ["langfuse>=2.0"]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",
    "F",
    "W",
    "I",
]
ignore = [
    "E203",
    "E501",
]

[tool.ruff.lint.per-file-ignores]
# Entry scripts set sys.path / load_dotenv before importing src.*
"scripts/*.py" = ["E402"]

[tool.mypy]
python_version = "3.11"
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_return_any = true
no_implicit_optional = true
check_untyped_defs = true
exclude = [
    "^tests/",
]

[[tool.mypy.overrides]]
module = "src.environments.textworld_env"
ignore_missing_imports = true
disable_error_code = ["import-untyped", "import-not-found", "unused-ignore"]

[[tool.mypy.overrides]]
module = "src.utils.model_wrapper"
ignore_missing_imports = true
disable_error_code = ["unused-ignore", "arg-type", "import-not-found"]

[[tool.mypy.overrides]]
module = [
    "src.utils.inference.vllm",
    "src.utils.inference.lmstudio.responses",
]
ignore_missing_imports = true
disable_error_code = ["unused-ignore", "import-not-found", "no-any-return"]

[[tool.mypy.overrides]]
module = "src.utils.tracing"
ignore_missing_imports = true
disable_error_code = [
    "arg-type",
    "union-attr",
    "assignment",
    "no-any-return",
    "typeddict-item",
    "unused-ignore",
    "import-not-found",
]

[[tool.mypy.overrides]]
module = "src.utils.logging_utils"
ignore_missing_imports = true
disable_error_code = ["import-not-found"]

[[tool.mypy.overrides]]
module = [
    "src.analysis.visualization",
    "src.analysis.calibration",
    "src.analysis.thresholds",
    "src.utils.dotenv_loader",
]
disable_error_code = ["unused-ignore"]

[tool.coverage.run]
source = ["src"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = false
