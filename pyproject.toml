[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "metacog-llm-compute"
version = "0.1.0"
description = "Metacognitive effort allocation in sequential LM agents"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "pandas",
    "scipy",
    "pyyaml",
    "python-dotenv>=1.0.0",
    "matplotlib",
    "seaborn",
]
[project.optional-dependencies]
dev = ["pytest>=7", "pytest-cov>=4", "ruff>=0.6.0", "mypy>=1.11.0", "pre-commit>=4.0.0"]
full = [
    "vllm==0.19.1",
    "transformers==4.56.2",
    "torch==2.4.0",
    "openai>=1.0.0",
    "accelerate",
    "textworld",
]
tracing = ["langfuse>=2.0"]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",
    "F",
    "W",
    "I",
]
ignore = [
    "E203",
    "E501",
]

[tool.mypy]
python_version = "3.10"
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_return_any = true
no_implicit_optional = true
check_untyped_defs = true
exclude = [
    "^tests/",
]

[tool.coverage.run]
source = ["src"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = false
