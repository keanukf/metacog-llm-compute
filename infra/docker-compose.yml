# Dashboard only. MLflow, MinIO, PostgreSQL run on the home server (NPM: mlflow.home, minio.home).
# Usage: from repo root, copy infra/.env from .env.example and set MLflow/MinIO env vars, then:
#   docker compose -f infra/docker-compose.yml up -d

services:
  dashboard:
    build:
      context: infra/dashboard
      dockerfile: Dockerfile
    ports:
      - "8501:8501"
    environment:
      MLFLOW_TRACKING_URI: ${MLFLOW_TRACKING_URI:-http://mlflow.home}
      MLFLOW_S3_ENDPOINT_URL: ${MLFLOW_S3_ENDPOINT_URL:-http://minio.home}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      MINIO_BUCKET: ${MINIO_BUCKET:-mlflow}
    env_file:
      - .env
