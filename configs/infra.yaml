# Infrastructure: MLflow tracking and MinIO storage (home lab behind Nginx Proxy Manager).
# Services are reachable via internal DNS: mlflow.home, minio.home (no host ports required).

tracking:
  mlflow_uri: "http://mlflow.home"
  s3_endpoint: "http://minio.home"
  experiment_name: "metacog-llm-compute"

storage:
  bucket: "mlflow"
# MinIO credentials from infra/.env: AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY (or MINIO_ROOT_USER, MINIO_ROOT_PASSWORD).
# Same .env is used by the dashboard and by scripts when using --infra-config.
