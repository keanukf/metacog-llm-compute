# LM Studio-only overrides (merged into configs/pilot.yaml when using --pilot-mode lmstudio).
# Set enabled: true and fill model / inference below so you do not have to edit pilot.yaml
# when switching between local MLX/CUDA and LM Studio.
#
# When enabled is false or this file is missing, LM Studio runs use pilot.yaml as-is.

enabled: true

model:
  name: "qwen/qwen3-4b"
  dtype: int4

inference:
  backend: mlx
  # POST /v1/responses top_logprobs width (Shannon TLE over renormalized top-k)
  lmstudio_top_logprobs: 5

# Local-only nudge for small transition models: keep it about format, not about solving.
#domain_prompts:
#  tower_of_hanoi:
#    prefix: >
#      You are solving Tower of Hanoi. Only the top disk on a peg may move; place it on an empty
#      peg or on a larger-numbered disk. Each turn you must choose exactly one move from the line
#      starting with "Valid moves:" in the task text—do not output any other peg pair. Respond with
#      ONLY your move as X->Y using peg letters A, B, or C (e.g. A->C). Do not use disk numbers. Do
#      not explain your reasoning.

#      Example (format only): If the valid moves line lists "A->B, A->C", reply with exactly one of
#      them like: A->C

pilot:
  instances: 1 # 5 is default, 2 is for the pilot
  # Compute stages selection:
  # - Back-compat: 1/2/3 means run first N stages (C0/C1/C2)
  # - Explicit: "C0" or ["C0","C2"]
  # - Per-domain: compute_stages_by_domain overrides global compute_stages
  compute_stages: C1   # e.g. C0 | C0,C2 | 1 | 2 | 3
  # compute_stages_by_domain:
  #   textworld: C0
  #   tower_of_hanoi: C0
  runs_per_instance: 1

test1_inference:
  num_prompts: 10
  expected_tok_per_sec_min: 30

test3_verbalized_confidence:
  num_easy: 5
  num_hard: 5

test4_textworld:
  num_mini_envs: 3
  max_rooms: 5
  max_env_steps: 5

tower_of_hanoi:
  pilot_episodes: 1
  pilot_num_disks: 3
  pilot_max_steps: 10
  # Conservative local diversification to avoid 10× identical starts.
  num_disks_range: [3, 3]
  partial_start_range: [0, 1]
  task_generation_seed: 42
