# Core experiment configuration — Phase 1 (Calibration) and Phase 2 (Adaptive Allocation).
# See blueprints/infrastructureplan_pilot.md Section III.

model:
  name: "Qwen/Qwen3-8B"
  revision: "b968826d9c46dd6066d109eabc6255188de91218"
  # vLLM 0.19+ accepts float16/bfloat16 literals only (not fp16/bf16 aliases).
  dtype: float16

inference:
  temperature: 0.3
  max_tokens: 256
  # Qwen3-8B advertises 40960 context; cap for 24 GB GPUs (KV cache OOM otherwise).
  max_model_len: 16384
  avg_tokens_per_call: 200
  top_logprobs: 20

# Parallel episode execution (Phase 1/2 with --real use ServerBackend against vllm serve).
execution:
  # Set on Pod after measure_concurrent_throughput.py; batch parity must use this same N.
  max_concurrent_episodes: 32
  backend_mode: server
  server_url: "http://127.0.0.1:8000/v1"
  # Optional freeze after TLE invariance validation (written to run_metadata.frozen_execution_params):
  # frozen_max_concurrent_episodes: 4
  # frozen_tle_invariance_eps: 0.05

phase1:
  domains: ["textworld", "tower_of_hanoi"]
  instances_per_domain: 50
  compute_stages: 3   # C0, C1, C2
  runs_per_condition: 5
  # 100 instances * 3 stages * 5 runs = 1500 episodes

phase2:
  domains: ["textworld", "tower_of_hanoi"]
  instances_per_domain: 50
  # Required for adaptive_tle, adaptive_vc, eager_style (hard-fail if missing). Built by
  # scripts/phase2_prep/build_threshold_artifact.py against the real Phase 1 canonical dataset
  # (see docs/consistency_log.md 2026-08-04 entry, docs/adrs.md ADR-009 for the selection rule).
  policy_artifact: "data/results/phase1/threshold_artifact.json"
  strategies:
    - adaptive_tle
    - adaptive_vc
    - always_c0
    - always_c2
    - random
    - eager_style
  runs_per_condition: 5
  # 100 * 6 * 5 = 3000 episodes

paths:
  tasks_dir: "data/tasks"
  task_manifests:
    textworld: "data/tasks/textworld/difficulty_manifest.json"
    tower_of_hanoi: "data/tasks/tower_of_hanoi/difficulty_manifest.json"
  results_phase1: "data/results/phase1"
  results_phase2: "data/results/phase2"

# Same keys as pilot.yaml — logprob sidecar policy for Phase 1/2 (checkpoint_dir / logprob_subdir).
logging:
  # off | action_window | full — production: action_window (TLE reanalysis without reasoning bloat)
  logprob_sidecar_mode: action_window
  # Full reasoning sidecars intentionally OFF for Phase 2 (see docs/consistency_log.md 2026-08-04
  # "Full reasoning logprob sidecars dropped for Phase 2"). Phase 1 already collected this subset
  # (data/results/phase1/, 6 non-holdout instances x 3 stages x 5 runs, still on disk) and no
  # implemented or preregistered analysis reads reasoning-token logprobs -- re-collecting it in
  # Phase 2 would only add multi-hundred-GB storage risk to a one-shot run for no analytical gain.
  logprob_sidecar_full_instances: {}
  logprob_export_format: json
  logprob_subdir: logprobs
  save_vc_distributions: false
  vc_export_format: json   # json | csv | both — VC follow-up sidecars (*_vc.json)
  vc_subdir: vc
  save_step_traces: false   # true for debugging: trace_{episode_id}.jsonl in checkpoint dir
  write_debug_views: true   # builds debug_views/ from traces (forces save_step_traces when true)
  debug_view_head_chars: 800
  debug_view_tail_chars: 800

tracing:
  langfuse_enabled: false  # disabled 2026-08-10: Langfuse quota exhausted mid-run (403 Forbidden
  # on every export for the rest of the run); purely additive observability, no effect on collected
  # episode data (src/utils/tracing.py: no-op when disabled). Re-enable once quota/plan is sorted.

# Compute stage C1 (single reasoning call).
c1:
  cot_temperature: 0.5

# Compute stage C2 (Self-Consistency / majority vote).
c2:
  n_samples: 3
  sample_temperature: 0.7

# Domain prompting / action-generation settings (environment-specific; not signal extraction).
domain_prompts:
  textworld:
    prefix: >
      You are playing a parser-based text adventure (interactive fiction). Base each reply on the
      latest game text shown below. Use only parser commands from the templates below (e.g. go north,
      look, take key). Do not add narration, quotes, role-play, multiple actions, or reasoning.
      
      Command templates (valid forms; do NOT assume an explicit list of allowed commands will be provided):
      - go [north|south|east|west|up|down]
      - take [object]
      - drop [object]
      - examine [object]
      - open [container]
      - close [container]
      - put [object] in [container]
      - cook [object] with [tool]
      - chop [object] with [tool]
      - slice [object] with [tool]
      - dice [object] with [tool]
      - prepare meal
      - eat meal
      - inventory
      - look
    action_max_tokens: 32
    action_stop: ["\n"]
    include_admissible_commands: false
    cot_max_tokens: 8192
    # Full episode history (H3 confound control) — explicit off
    history_keep_last_pairs: null
    history_max_obs_chars: 0
    history_current_obs_max_chars: 0
    history_obs_head_ratio: 0.15
    pin_recipe: false
  tower_of_hanoi:
    prefix: >
      You are solving Tower of Hanoi. Only the top disk on a peg may move; place it on an empty
      peg or on a larger-numbered disk.

      Output format:
      - Output exactly ONE move as [source_peg]->[target_peg] using only A, B, or C (e.g. A->C).
      - No disk numbers. No explanation. Single line only.
    action_max_tokens: 32
    include_valid_moves: false
    cot_max_tokens: 8192
    history_keep_last_pairs: null
    history_max_obs_chars: 0
    history_current_obs_max_chars: 0
    history_obs_head_ratio: 0.15
    pin_recipe: false

# Verbalized confidence: separate short follow-up call (recommended) or parse from action text (inline).
vc:
  mode: followup
  judged_context: action_only   # action_only | full (exploratory)
  retry_on_parse_failure: true
  followup_max_tokens: 4
  followup_temperature: 0.2
  followup_max_context_chars: null
  followup_cot_max_chars: 12000
  raw_completion_max_chars: 8000
  followup_instruction: |
    How likely is the chosen action to be correct in this situation?
    Respond with only a single integer between 0 and 100,
    where 0 means certainly wrong and 100 means certainly correct.

episode:
  # TextWorld production cap, validated in Gate D (docs/consistency_log.md, 2026-07-18/20:
  # r5_i1_take+cook corridor confirmed at cap=45, n=16, 43.75% success). Tower of Hanoi ignores
  # this in practice -- make_experiment_env() uses each manifest instance's own 3x-optimal_steps
  # cap instead (src/utils/experiment_env.py); this value is only its fallback if no manifest
  # entry is found.
  max_steps_per_episode: 45
  avg_steps: 10

# Tower of Hanoi: vary number of disks and partial-start depth.
tower_of_hanoi:
  num_disks_range: [3, 4]
  partial_start_range: [0, 3]
  task_generation_seed: 42
