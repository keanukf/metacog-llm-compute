# Core experiment configuration — Phase 1 (Calibration) and Phase 2 (Adaptive Allocation).
# See blueprints/infrastructureplan_pilot.md Section III.

model:
  name: "Qwen/Qwen2.5-3B-Instruct"
  dtype: fp16

inference:
  temperature: 0.3
  max_tokens: 256
  avg_tokens_per_call: 200

phase1:
  domains: ["textworld", "delayed_cue"]
  instances_per_domain: 50
  compute_stages: 3   # C0, C1, C2
  runs_per_condition: 5
  # 100 instances * 3 stages * 5 runs = 1500 episodes

phase2:
  domains: ["textworld", "delayed_cue"]
  instances_per_domain: 50
  strategies:
    - adaptive_tle
    - adaptive_vc
    - always_c0
    - always_c2
    - random
    - eager_style
  runs_per_condition: 5
  # 100 * 6 * 5 = 3000 episodes

paths:
  tasks_dir: "data/tasks"
  results_phase1: "data/results/phase1"
  results_phase2: "data/results/phase2"

episode:
  max_steps_per_episode: 20
  avg_steps: 10
