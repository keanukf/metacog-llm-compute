# Pilot study configuration — feasibility validation (~2 GPU-hours).
# See blueprints/infrastructureplan_pilot.md Section V.
#
# Default for all backends: edit model/inference here. For LM Studio only, optional
# configs/lmstudio_config.yaml is deep-merged on top when enabled: true (see that file).

model:
  # CUDA/vLLM candidate for RunPod pilot validation (4B)
  name: "Qwen/Qwen3-4B"
  revision: "1cfa9a7208912126459214e8b04321603b3df60c"
  dtype: float16

inference:
  backend: cuda
  temperature: 0.3
  max_tokens: 256
  max_model_len: 16384
  chat_template: true
  enable_thinking: false
  avg_tokens_per_call: 200  # input ~120, output ~80
  # For pilot-mode lmstudio: LM Studio local server (OpenAI-compatible). URL may be …/v1 or host:port only.
  # lmstudio_base_url: "http://192.168.178.173:1234/v1"
  # lmstudio_api_key: "lm-studio"   # or set env LM_STUDIO_API_KEY / LM_STUDIO_BASE_URL
  # Top-k logprob width per token (vLLM SamplingParams.logprobs; LM Studio /v1/responses top_logprobs)
  top_logprobs: 20

pilot:
  instances: 5 # 5 is default, 2 is for the pilot
  # Compute stages selection:
  # - Back-compat: 1/2/3 means run first N stages (C0/C1/C2)
  # - Explicit: "C0" or ["C0","C2"]
  # - Per-domain: compute_stages_by_domain overrides global compute_stages
  compute_stages: 3   # e.g. 3 | C0 | C0,C2 | ["C0","C2"]
  # compute_stages_by_domain:
  #   textworld: C0
  #   tower_of_hanoi: C0
  runs_per_instance: 1
  # Test 5: instances × 3 stages × runs_per_instance = 5×3×3 = 45 episodes

# Optional: full per-token top-k logprob distributions (sidecar JSON under logprob_subdir; optional CSV).
# Default off — size scales with env_steps × completion_tokens × top_k. Episode JSON stays summary-only (TLE mean/max).
# Stored TLE entropy uses softmax renormalized over inference.top_logprobs candidates (not full vocabulary).
logging:
  logprob_sidecar_mode: full
  logprob_export_format: json   # json | csv | both
  logprob_subdir: logprobs
  save_vc_distributions: true
  vc_export_format: json
  vc_subdir: vc   # sidecar folder for VC follow-up distributions (parallel to logprob_subdir)
  # Per-episode JSONL: full prompt + model response per env step (trace_{episode_id}.jsonl)
  save_step_traces: true
  # Compact JSON pipeline views (truncated prompts/responses) under debug_views/ — always after run
  write_debug_views: true
  debug_view_head_chars: 800
  debug_view_tail_chars: 800

# Optional Langfuse cloud tracing (install: pip install ".[tracing]"). Use env keys, not committed YAML.
tracing:
  langfuse_enabled: true
  # langfuse_host: "https://cloud.langfuse.com"   # EU: https://eu.cloud.langfuse.com

# Compute stage C1 (single reasoning call) — explicitly parameterized for reproducibility.
c1:
  cot_temperature: 0.5
  # Global fallback when a domain omits domain_prompts.<domain>.cot_max_tokens
  cot_max_tokens: 1024

# Compute stage C2 (Self-Consistency / majority vote).
c2:
  n_samples: 3
  sample_temperature: 0.7

# Domain prompting / action-generation settings (environment-specific; not signal extraction).
domain_prompts:
  textworld:
    prefix: >
      You are playing a parser-based text adventure. Your GOAL is to WIN the game.
      You WIN when you have successfully prepared the meal AND eaten it.

      Important: You have an inventory from the start of the game. You can inspect it any time with: inventory.
      
      Command templates (valid forms; do NOT assume an explicit list of allowed commands will be provided):
      - go [north|south|east|west|up|down]
      - take [object]
      - drop [object]
      - examine [object]
      - open [container]
      - close [container]
      - put [object] in [container]
      - cook [object] with [tool]
      - inventory
      - look
      - Examples:
        - If you see: "You are in a small room. Exits: north." you can reply: go north
        - If you see: "You see a key here." you can reply: take key
    action_max_tokens: 256
    # Avoid stopping on the leading newline many chat/instruct models emit.
    action_stop: ["\n\n"]
    action_temperature: 0.3
    # Episodic memory compaction controls (base_agent.run_episode):
    # Keep the first reset observation plus the last N ACTION/OBSERVATION pairs.
    # Very liberal for local runs: keep effectively the whole episode in-context.
    history_keep_last_pairs: 1000000
    # Disable truncation entirely (0 => no truncation in base_agent._truncate_for_history).
    history_max_obs_chars: 0
    # Disable truncation for the current observation as well.
    history_current_obs_max_chars: 0
    # Share of chars kept from the start of an observation (rest comes from the end).
    history_obs_head_ratio: 0.15
    # Once a recipe is discovered, keep it pinned in context for the remainder of the episode.
    pin_recipe: true
    # Default off: do not list admissible commands in the observation (methodological control).
    include_admissible_commands: false
    # C1 CoT budget (generation cap for the planning subcall; raised after RunPod truncation)
    cot_max_tokens: 2048
  tower_of_hanoi:
    prefix: >
      You are solving Tower of Hanoi. Only the top disk on a peg may move; place it on an empty
      peg or on a larger-numbered disk.

      Output format:
      - Output exactly ONE move as [source_peg]->[target_peg] using only A, B, or C (e.g. A->C).
      - No disk numbers. No explanation. Single line only.
    action_max_tokens: 256
    action_stop: ["\n"]
    action_temperature: 0.3
    # Keep full action/observation history for Hanoi; the episodes are short (<= 20 steps)
    # and analysis/debugging often needs complete trajectories.
    history_keep_last_pairs: 1000000
    # Default off: do not list legal moves in the observation (methodological control).
    include_valid_moves: false
    # Hanoi needs more CoT room than TextWorld (multi-step plan before the move line).
    cot_max_tokens: 2048

vc:
  mode: followup
  followup_max_tokens: 24
  followup_temperature: 0.0
  # Verbalized confidence follow-up (ends with "Confidence:" for format compliance on small instruct models).
  followup_instruction: |
    How likely is the chosen action to be correct in this situation?
    Respond with only a single integer between 0 and 100,
    where 0 means certainly wrong and 100 means certainly correct.

    Confidence:

paths:
  # TextWorld pilot episodes load ``textworld_{instance}.z8`` (or ``.ulx``) from here or
  # ``<tasks_dir>/textworld/`` — same layout as Phase 1/2 (see ``src/utils/experiment_env.py``).
  tasks_dir: "data/tasks"
  pilot_benchmark: "data/results/pilot_benchmark.json"
  pilot_calibration: "data/results/pilot_calibration.json"
  pilot_cost_validation: "data/results/pilot_cost_validation.md"
  pilot_feasibility_report: "data/results/pilot_feasibility_report.md"

test1_inference:
  num_prompts: 10
  # Completion plan target for RTX 3090 validation
  expected_tok_per_sec_min: 50

test3_verbalized_confidence:
  num_easy: 5
  num_hard: 5

test4_textworld:
  num_mini_envs: 3
  max_rooms: 5
  # Max environment steps per TextWorld episode (gym max_episode_steps matches this).
  max_env_steps: 25

tower_of_hanoi:
  # Pilot add-on: parseability validation on 3-disk problems at C0
  pilot_episodes: 20
  pilot_num_disks: 3
  pilot_max_steps: 20
  # New (preferred): diversify tasks across disk counts and partial starts.
  # If omitted, Test 5 falls back to pilot_num_disks and a full-start state (partial_start_range=[0,0]).
  num_disks_range: [3, 4]
  partial_start_range: [0, 2]
  task_generation_seed: 42
