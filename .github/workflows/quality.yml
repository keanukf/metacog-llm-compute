name: quality

on:
  push:
    branches:
      - main
      - "feat/**"
  pull_request:

jobs:
  lint-type-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install package and dev dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Ruff lint
        run: ruff check src tests

      - name: Ruff format check
        run: ruff format --check src tests

      - name: MyPy type check
        run: mypy src/signals/verbalized_confidence.py

      - name: Pytest
        run: python -m pytest tests/ -v --cov=src --cov-report=term-missing --cov-fail-under=50
